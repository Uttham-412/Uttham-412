<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
      x1="0" y1="0"
      x2="1280" y2="400"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080A0D"/>
      <stop offset="1" stop-color="#0D1015"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent"
      x1="90" y1="0"
      x2="500" y2="0"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E7CFF"/>
      <stop offset="1" stop-color="#9B6CFF"/>
    </linearGradient>

    <!-- Subtle ambient light -->
    <radialGradient id="ambient"
      cx="0" cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1050 190) rotate(90) scale(240)">
      <stop offset="0" stop-color="#5664FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#5664FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle grid -->
    <pattern id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse">

      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".025"/>

    </pattern>

  </defs>


  <!-- ============================= -->
  <!-- BACKGROUND -->
  <!-- ============================= -->

  <rect
    width="1280"
    height="400"
    fill="url(#bg)"/>

  <rect
    width="1280"
    height="400"
    fill="url(#grid)"/>

  <rect
    width="1280"
    height="400"
    fill="url(#ambient)"/>


  <!-- ============================= -->
  <!-- BORDERS -->
  <!-- ============================= -->

  <rect
    width="1280"
    height="1"
    fill="#FFFFFF"
    fill-opacity=".08"/>

  <rect
    y="399"
    width="1280"
    height="1"
    fill="#FFFFFF"
    fill-opacity=".08"/>


  <!-- ============================= -->
  <!-- TERMINAL ICON -->
  <!-- ============================= -->

  <rect
    x="92"
    y="92"
    width="34"
    height="22"
    rx="5"
    fill="#11151C"
    stroke="#FFFFFF"
    stroke-opacity=".09"/>

  <text
    x="101"
    y="108"
    fill="#7D8BFF"
    font-family="monospace"
    font-size="13">
    &gt;_
  </text>


